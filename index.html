<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge House Taphouse | Ambridge, PA</title>
  <meta name="description" content="Bridge House Taphouse — craft beer, cocktails, and great food in Ambridge, PA. View menu, drink specials, and join VIP perks." />

  <style>
    :root{
      --bg:#0c0f12;
      --panel:#121820;
      --panel2:#0f141b;
      --text:#e9eef6;
      --muted:#a7b2c3;
      --brand:#e3b04b;
      --brand2:#7dd3fc;
      --stroke:rgba(255,255,255,.10);
      --shadow: 0 16px 40px rgba(0,0,0,.45);
      --radius:18px;
      --radius2:26px;
      --max: 1120px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(227,176,75,.14), transparent 55%),
                  radial-gradient(900px 600px at 80% 10%, rgba(125,211,252,.12), transparent 55%),
                  var(--bg);
      color:var(--text);
      line-height:1.35;
    }
    a{color:inherit}
    .wrap{max-width:var(--max); margin:0 auto; padding:24px;}
    .nav{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background: rgba(12,15,18,.70);
      border-bottom:1px solid var(--stroke);
    }
    .nav-inner{
      max-width:var(--max); margin:0 auto; padding:12px 24px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      letter-spacing:.2px;
    }
    .brand-badge{
      width:38px; height:38px; border-radius:12px;
      background: linear-gradient(135deg, rgba(227,176,75,.95), rgba(125,211,252,.65));
      display:grid; place-items:center;
      box-shadow: var(--shadow);
      font-weight:800;
      color:#0b0f12;
    }
    .brand-title{font-weight:800}
    .brand-sub{color:var(--muted); font-size:12px; margin-top:2px}
    .nav-links{
      display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;
    }
    .chip{
      text-decoration:none;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      padding:8px 10px;
      border-radius:999px;
      font-size:13px;
      color:var(--text);
      transition:.18s ease;
    }
    .chip:hover{transform: translateY(-1px); border-color: rgba(227,176,75,.35)}
    .chip.primary{
      background: rgba(227,176,75,.14);
      border-color: rgba(227,176,75,.35);
    }

    /* Hero */
    .hero{
      padding:22px 0 10px;
    }
    .hero-grid{
      display:grid;
      grid-template-columns: 1.25fr .75fr;
      gap:18px;
      align-items:stretch;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .hero-main{
      padding:26px;
      position:relative;
      min-height: 340px;
    }
    .kicker{
      color: var(--brand);
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:12px;
    }
    h1{margin:10px 0 10px; font-size:42px; line-height:1.05}
    .lead{color:var(--muted); font-size:16px; max-width: 58ch}
    .cta-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:11px 14px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      transition:.18s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.gold{
      background: rgba(227,176,75,.18);
      border-color: rgba(227,176,75,.45);
    }
    .meta{
      display:grid; grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:18px;
    }
    .meta .mini{
      padding:12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.15);
    }
    .mini .t{font-weight:800; font-size:13px}
    .mini .s{color:var(--muted); font-size:13px; margin-top:4px}
    .hero-photos{
      display:grid;
      grid-template-rows: 1fr 1fr 1fr;
      gap:12px;
      padding:12px;
    }
    .photo{
      border-radius:16px;
      border:1px solid var(--stroke);
      overflow:hidden;
      background: rgba(0,0,0,.25);
      position:relative;
    }
    .photo img{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.05) saturate(1.05);
    }
    .photo .tag{
      position:absolute; left:10px; bottom:10px;
      background: rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.18);
      padding:6px 10px;
      border-radius:999px;
      font-weight:700;
      font-size:12px;
      color:#fff;
    }

    /* Sections */
    section{padding:22px 0}
    .section-title{
      display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap;
      margin-bottom:12px;
    }
    .section-title h2{margin:0; font-size:26px}
    .section-title p{margin:0; color:var(--muted); max-width:65ch}
    .grid-2{display:grid; grid-template-columns: 1fr 1fr; gap:16px;}
    .grid-3{display:grid; grid-template-columns: repeat(3, 1fr); gap:16px;}

    /* Menu */
    .menu-tools{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .search{
      flex:1;
      min-width: 220px;
      display:flex; align-items:center; gap:10px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      padding:10px 12px;
      border-radius:12px;
    }
    .search input{
      width:100%;
      background:transparent;
      border:0;
      outline:0;
      color:var(--text);
      font-size:14px;
    }
    .pillbar{display:flex; gap:8px; flex-wrap:wrap}
    .pill{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      border-radius:999px;
      padding:8px 10px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      transition:.15s ease;
    }
    .pill.active{
      border-color: rgba(227,176,75,.45);
      background: rgba(227,176,75,.14);
    }

    .menu-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:16px;
      margin-top:14px;
    }
    .menu-card{padding:14px 14px 6px}
    .menu-cat{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px;
      border-radius:16px;
      background: rgba(0,0,0,.16);
      border:1px solid var(--stroke);
      margin-bottom:10px;
    }
    .menu-cat h3{margin:0; font-size:16px}
    .menu-cat span{color:var(--muted); font-size:12px}
