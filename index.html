:root{
  --bg:#0c0f12;
  --panel:#141a22;
  --text:#e9eef6;
  --muted:#a7b2c3;
  --gold:#e3b04b;
  --stroke:rgba(255,255,255,.12);
  --radius:18px;
  --radius-lg:26px;
  --max:1100px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

a{color:inherit;text-decoration:none}

.wrap{
  max-width:var(--max);
  margin:auto;
  padding:24px;
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  z-index:20;
  background:#0b0f14;
  border-bottom:1px solid var(--stroke);
}

.nav-inner{
  max-width:var(--max);
  margin:auto;
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:900;
  font-size:18px;
}

.nav a{
  margin-left:14px;
  font-size:14px;
  color:var(--muted);
}
.nav a:hover{color:var(--gold)}

}
