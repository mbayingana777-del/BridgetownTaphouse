<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Full Menu | Bridgetown Taphouse</title>
<meta name="description" content="Full menu for Bridgetown Taphouse in Ambridge, PA.">

<style>
:root{
  --bg:#0c0f12;
  --panel:#141a22;
  --text:#e9eef6;
  --muted:#a7b2c3;
  --gold:#e3b04b;
  --stroke:rgba(255,255,255,.12);
  --radius:18px;
  --max:1100px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:auto;padding:24px}
.card{
  background:var(--panel);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:20px;
}
.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:12px;
  border:1px solid var(--stroke);
  font-weight:700;
}
.btn.primary{
  background:rgba(227,176,75,.2);
  border-color:rgba(227,176,75,.5);
}
h1{margin:10px 0 8px}
p{color:var(--muted);margin-top:0}
</style>
</head>

<body>
  <div class="wrap">
    <a class="btn" href="index.html">← Back to Home</a>

    <h1>Full Menu</h1>
    <p>Add your complete menu here next.</p>

    <div class="card">
      <h2 style="margin-top:0">Burgers & Sandwiches</h2>
      <p style="color:var(--muted)">Coming next…</p>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Plates & Salads</h2>
      <p style="color:var(--muted)">Coming next…</p>
    </div>
  </div>
</body>
</html>
